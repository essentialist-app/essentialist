name: Build Artifacts

on: workflow_call

permissions:
  contents: read
  packages: write

jobs:

  build-for-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Update package definition
      run: sudo apt-get update

    - name: Install X11 headers
      run: sudo apt-get install -y libgl1-mesa-dev xorg-dev

    - name: Build essentialist
      run: go build -o ./essentialist-linux ./cmd/essentialist

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Essentialist for Linux (amd64)
        path: ./essentialist-linux

  build-for-linux-flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
    - uses: actions/checkout@v4
    - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: essentialist.flatpak
        manifest-path: cmd/essentialist/flatpak/io.github.essentialist_app.essentialist.yml
        cache-key: flatpak-builder-${{ github.sha }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Essentialist for Linux (flatpak)
        path: ./essentialist.flatpak

  build-for-android:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r27
        add-to-path: false
    - uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Install fyne
      run: go install fyne.io/tools/cmd/fyne@latest

    - name: Build essentialist
      run: cd cmd/essentialist && ~/go/bin/fyne package -os android && cp Essentialist.apk ../.. && cd -
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Essentialist for Android (APK)
        path: ./Essentialist.apk

  build-for-mac-os:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install fyne
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Build essentialist
        run: cd cmd/essentialist && ~/go/bin/fyne package -os darwin && ls && find .

      - name: Upload Artifact (intel)
        uses: actions/upload-artifact@v4
        with:
          name: Essentialist for MacOS (intel)
          path: ./essentialist-mac-os-intel

      - name: Upload Artifact (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: Essentialist for MacOS (arm64)
          path: ./essentialist-mac-os-arm64

  build-for-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build essentialist
        run: go build -x -o essentialist.exe ./cmd/essentialist

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Essentialist for Windows (x64)
          path: ./essentialist.exe
